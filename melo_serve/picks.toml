# Built-in picks: a model on a backend.
#
# source       Splash: OWNER/REPO:VARIANT. oMLX: a Hugging Face repo (found in the
#              local Hugging Face cache) or a folder path.
# served_name  the model id the front door lists and answers to.
# mem_gb       how far free memory drops while the pick answers, measured on a
#              Mac with measured_ram_gb of memory; without it the fit check
#              estimates from disk_gb.
# load_s, decode_tps: measured on that Mac (decode: a short prompt).

[[pick]]
id = "qwen3.8-27b-splash"
aliases = ["27b"]
name = "Qwen3.8 27B"
role = "chat"
backend = "splash"
source = "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M"
served_name = "Qwen3.8-27B-Q4KM-splash"
summary = "balanced; leaves room for other work"
disk_gb = 21.2
mem_gb = 21
measured_ram_gb = 128
load_s = 16
decode_tps = 78.2
caps = ["tools", "vision", "reasoning"]
min_ram_gb = 48

