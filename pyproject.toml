[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "melo-serve"
version = "0.3.1"
description = "Run and switch local model servers on a Mac behind one stable OpenAI-compatible address."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "huggingface-hub>=2.4.0,<3",
    "yarl>=1.9",
]

[project.scripts]
melo-serve = "melo_serve.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-testmon>=2.1",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["melo_serve"]

[tool.hatch.build.targets.sdist]
include = ["melo_serve", "tests", "README.md", "LICENSE"]

# ── pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".cache/pytest"

# ── ruff ──
[tool.ruff]
line-length = 88
target-version = "py311"
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N818"]  # line length: the formatter's; error names read as they are

[tool.ruff.lint.isort]
known-first-party = ["melo_serve"]

# ── mypy ──
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_configs = true
cache_dir = ".cache/mypy"
